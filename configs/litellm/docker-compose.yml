services:
  litellm:
    # Pinned, and NOT to a floating tag. Two traps here, both verified 2026-10-26:
    #
    #  1. `main-latest` sounds newest but is STALE — it was built 2026-09-16 while
    #     `main-stable` was built 2026-10-23. The names mislead.
    #  2. The old `main-v<X.Y.Z>-stable` family ENDED at main-v1.83.14-stable. There
    #     is no `main-v1.106*-stable`. Current stable is the bare version tag.
    #
    # `v1.106.4`, `main-stable` and `latest` are byte-identical today (digest
    # sha256:c169fb3a…). Pin the explicit version so a floating tag cannot move
    # under you mid-workshop and give every student a different proxy.
    #
    # To find newer tags (the registry caps listing at 1000, so sort them):
    #   TOKEN=$(curl -s "https://ghcr.io/token?scope=repository:berriai/litellm:pull" | jq -r .token)
    #   curl -s -H "Authorization: Bearer $TOKEN" \
    #     "https://ghcr.io/v2/berriai/litellm/tags/list?n=1000" \
    #     | jq -r '.tags[]' | grep -E '^v[0-9]' | sort -V | tail
    # Image tags and PyPI versions use different numbering; do not expect them to match.
    image: ghcr.io/berriai/litellm:v1.106.4
    container_name: litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - LITELLM_LOG=INFO
    # THE LINE THAT MAKES IT WORK ON LINUX.
    # LiteLLM runs inside a container, but llama-swap/llama.cpp run on the host.
    # From inside the container, 127.0.0.1 means the CONTAINER, not your laptop,
    # so config.yaml points api_base at `host.docker.internal`. Docker Desktop
    # (macOS/Windows) provides that name automatically; Linux does not, and this
    # line adds it. Harmless on macOS/Windows, required on Linux and WSL2.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
